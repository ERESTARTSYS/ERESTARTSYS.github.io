name: Build blog from private issues
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
      - name: Set site URL
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python3 scripts/configure.py
      - name: Fetch public issues privately
        env:
          CONTENT_OWNER: ${{ secrets.CONTENT_OWNER }}
          CONTENT_REPO: ${{ secrets.CONTENT_REPO }}
          CONTENT_PAT: ${{ secrets.CONTENT_PAT }}
        run: python3 scripts/fetch_issues.py
      - name: Compute content digest without printing Markdown
        id: digest
        run: python3 scripts/digest.py
      - name: Check previous published digest
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: .state/build-stamp
          key: published-${{ steps.digest.outputs.sha }}
          lookup-only: true
      - name: Build without exposing article bodies in logs
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! zola build --output-dir public --force > "$RUNNER_TEMP/zola-build.log" 2>&1; then
            echo 'Build failed. No article content was printed. Review Markdown locally.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          path: public
      - id: deployment
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/deploy-pages@v4
      - name: Record published digest only
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          mkdir -p .state
          printf '%s' '${{ steps.digest.outputs.sha }}' > .state/build-stamp
      - uses: actions/cache/save@v4
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          path: .state/build-stamp
          key: published-${{ steps.digest.outputs.sha }}
