name: Add Hushline light mode

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hushline-light-mode-patch
  cancel-in-progress: false

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Install the Hushline theme updates
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path

          files = {
            'themes/hushline/static/css/hushline.css': '',
            'themes/hushline/static/js/hushline.js': '',
            'themes/hushline/templates/base.html': '',
          }
          for name, encoded in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
          PYCODE
          test -f zola.toml || { echo 'zola.toml was not found at the repository root.' >&2; exit 1; }

      - name: Install Zola 0.23.6
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz \
            --output /tmp/zola.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp zola
          chmod +x /tmp/zola
          sudo install /tmp/zola /usr/local/bin/zola
          zola --version

      - name: Build the site
        run: zola build --output-dir dist --force

      - name: Commit the theme and built site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add themes/hushline/static/css/hushline.css \
            themes/hushline/static/js/hushline.js \
            themes/hushline/templates/base.html dist
          if git diff --cached --quiet; then
            echo 'The Hushline light mode is already installed.'
            exit 0
          fi
          git commit -m 'Add Hushline light mode'
          git push origin "HEAD:${GITHUB_REF_NAME}"
