name: One-time install from site.zip
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack site.zip safely
        run: |
          python3 - <<'PY'
          import stat, zipfile
          from pathlib import Path
          root = Path.cwd().resolve()
          with zipfile.ZipFile('site.zip') as z:
              for entry in z.infolist():
                  name = entry.filename
                  target = (root / name).resolve()
                  if name.startswith('/') or not target.is_relative_to(root) or '.git' in Path(name).parts or stat.S_IFMT(entry.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit('Unsafe ZIP entry')
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(entry) as src, target.open('wb') as dst:
                          while chunk := src.read(1024 * 1024):
                              dst.write(chunk)
          PY
      - uses: actions/configure-pages@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
      - name: Set site URL
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python3 scripts/configure.py
      - name: Fetch public issues privately
        env:
          CONTENT_OWNER: ${{ secrets.CONTENT_OWNER }}
          CONTENT_REPO: ${{ secrets.CONTENT_REPO }}
          CONTENT_PAT: ${{ secrets.CONTENT_PAT }}
        run: python3 scripts/fetch_issues.py
      - name: Build without exposing article bodies in logs
        shell: bash
        run: |
          if ! zola build --output-dir public --force > "$RUNNER_TEMP/zola-build.log" 2>&1; then
            echo 'Build failed. No article content was printed. Review Markdown locally.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove bootstrap files after successful deployment
        env:
          PAGES_WRITE_PAT: ${{ secrets.PAGES_WRITE_PAT }}
        shell: bash
        run: |
          if [[ -z "$PAGES_WRITE_PAT" ]]; then
            echo 'PAGES_WRITE_PAT is required for one-time workflow removal.' >&2
            exit 1
          fi
          cp zola.template.toml zola.toml
          cp defaults/about.md content/about/_index.md
          rm -f content/blog/issue-*.md
          rm -rf public
          rm -f site.zip .github/workflows/install-from-zip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Zola blog and remove bootstrap files'
          header=$(printf 'x-access-token:%s' "$PAGES_WRITE_PAT" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin "HEAD:${GITHUB_REF_NAME}"
