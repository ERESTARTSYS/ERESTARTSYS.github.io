<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><meta name="color-scheme" content="dark light"><title>{% block title %}{{ config.title }}{% endblock %}</title><script>try{const t=localStorage.getItem("hushline-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.querySelector("meta[name=theme-color]").content=document.documentElement.dataset.theme==="light"?"#f4efdf":"#0b0b0b"}catch{document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}</script><link rel="stylesheet" href="{{ get_url(path='css/hushline.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script defer src="{{ get_url(path='js/toc.js') }}"></script><script type="module" src="{{ get_url(path='js/hushline.js') }}"></script></head><body><button class="theme-switch" type="button" aria-label="Change color theme">change to light</button><main class="wrap">{% block content %}{% endblock %}</main><footer class="footer"><span>© {{ now() | date(format="%Y") }} {{ config.title }}</span><span><a href="{{ get_url(path='tags') }}">tags</a> · <a href="{{ get_url(path='about') }}">about</a></span></footer></body></html>
